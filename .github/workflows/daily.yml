name: Daily Shoe Hunter

on:
  schedule:
    # 12:00 UTC = 7:00 AM Miami time year-round (EST winter / EDT summer differs by 1hr)
    # GitHub Actions schedules use UTC; adjust if you want a different local time.
    - cron: '0 12 * * *'
  workflow_dispatch:    # also lets you run it manually from the Actions tab

# Allow the workflow to commit results back to the repo
permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run shoe hunter
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT:   '587'
          EMAIL_FROM:  ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:    ${{ secrets.EMAIL_TO }}
          EMAIL_USER:  ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:  ${{ secrets.EMAIL_PASS }}
        run: python shoe_hunter.py

      - name: Upload results as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: shoe-hits-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Commit results back to repo (keeps a permanent history)
        run: |
          git config user.name  "shoe-hunter-bot"
          git config user.email "shoe-hunter-bot@users.noreply.github.com"
          git add results/ logs/ || true
          if ! git diff --staged --quiet; then
            git commit -m "Daily shoe hunter results: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
